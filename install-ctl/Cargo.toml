[package]
name = "install-ctl"
version = "0.1.0"
edition = "2024"
description = "Artifact installer — reads install/artifacts.toml at runtime to list and install workflow-tools artifacts"

[[bin]]
name = "install-ctl"
path = "src/main.rs"

[dependencies]
audit-api  = { git = "https://github.com/mankinskin/audit", branch = "main" }
clap       = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs       = "5"
gix-hash = { version = "0.28", features = ["sha1", "sha256"] }
gix-object = "0.66"
gix-protocol = { version = "0.67", features = ["blocking-client", "sha1", "sha256"] }
gix-transport = { version = "0.61", features = ["blocking-client", "http-client-curl-rust-tls"] }
ratatui = "0.29"
jsonc-parser = { version = "0.34", features = ["cst"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
sysinfo    = "0.32"
tempfile   = "3"
toml       = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gix-transport = { version = "0.61", features = ["http-client-insecure-credentials"] }
portable-pty = "0.8"
ratatui-testlib = { version = "0.1", features = ["ratatui-helpers"] }
vt100 = "0.15"
