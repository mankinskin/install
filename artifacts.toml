# Runtime-read artifact/hook/command registry for install-ctl (schema v1, see
# spec 97322185-2bda-4f25-85f7-f975a0b3fbad). No Rust recompile needed to
# add/remove an entry here — install-ctl reads this file at process start.
#
# The committed root COMMANDS.md is the deterministic `render_catalog`
# projection of this file; regenerate it whenever this file changes.

version = 1

[[artifact]]
id = "install-ctl"
category = "cli"
kind = "rust-binary"
source_path = "install/install-ctl"
owner = "workflow-tools"
lifecycle = ["install", "inspect", "uninstall"]
safety = "approval-required"
bin = "install-ctl"

